[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-science"
version = "0.1.0"
description = "Python experiment interface for the native Weave temporal graph engine"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
tables = ["pandas>=1.5"]
networkx = ["networkx>=3"]

[tool.setuptools.packages.find]
where = ["src"]
