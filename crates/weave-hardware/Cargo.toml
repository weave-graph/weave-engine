[package]
name = "weave-hardware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hardware fleet reference model, CSV/JSON importers and a seeded fleet dataset generator for Weave"

[dependencies]
weave-engine = { path = "../weave-engine", version = "0.23.0" }
weave-contract = { path = "../weave-contract", version = "0.23.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
