[package]
name = "weave-engine"
version = "0.17.0"
edition = "2021"
license = "MIT"
description = "Local-first Weave graph runtime foundation"

[dependencies]
ed25519-dalek = { version = "3.0.0-pre.6", default-features = false, features = ["alloc", "zeroize"] }
weave-cluster = { path = "../weave-cluster", version = "0.1.0" }
weave-spaces = { path = "../weave-spaces", version = "0.1.0" }
weave-policy = { path = "../weave-policy", version = "0.1.0" }
weave-contract = { path = "../weave-contract", version = "0.17.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
recovery-testing = []

[[example]]
name = "integration_probe"
required-features = ["recovery-testing"]

[[example]]
name = "governance_probe"
required-features = ["recovery-testing"]

[[example]]
name = "governance_delivery_probe"
required-features = ["recovery-testing"]
