[package]
name = "weave-browser-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Experimental browser transport for the shared trusted Rust facade"
[features]
browser-image-experiment = ["weave-host/browser-image-experiment"]
[dependencies]
weave-host = { path = "../weave-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[[example]]
name = "browser_host"
required-features = ["browser-image-experiment"]
