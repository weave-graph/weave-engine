[package]
name = "weave-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Authenticated multi-tenant Weave service over HTTP/JSON and TLS (B3)"
publish = false

[dependencies]
weave-engine = { path = "../weave-engine", version = "1.0.0" }
weave-contract = { path = "../weave-contract", version = "1.2.0" }
weave-policy = { path = "../weave-policy", version = "0.1.0" }
weave-mcp = { path = "../weave-mcp", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
weave-policy = { path = "../weave-policy", version = "0.1.0" }
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
tempfile = "3"
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
