[package]
name = "weave-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable signed capability verification with explicit trusted admission context"
publish = false

[dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
