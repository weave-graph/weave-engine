[package]
name = "weave-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Bounded trusted-host C ABI for the native Weave runtime"
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
recovery-testing = ["weave-engine/recovery-testing"]
browser-image-experiment = ["weave-engine/browser-image-experiment"]
[dependencies]
weave-engine = { path = "../weave-engine" }
weave-contract = { path = "../weave-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
[dev-dependencies]
tempfile = "3"
