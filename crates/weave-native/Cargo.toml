[package]
name = "weave-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Bounded trusted-host C ABI for the native Weave runtime"
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
weave-engine = { path = "../weave-engine" }
weave-contract = { path = "../weave-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
tempfile = "3"
