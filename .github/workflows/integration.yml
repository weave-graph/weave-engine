name: Language integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: weave-engine
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: 82a45f6391696b77e25710bde7276b40faf68d6f
          path: weave-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify actual compiler and persistent runtime
        run: |
          python3 weave-engine/scripts/root_integration.py
          python3 weave-engine/scripts/root_join.py
          python3 weave-engine/scripts/root_values.py
          python3 weave-engine/scripts/root_metadata.py
          python3 weave-engine/scripts/root_paper_example.py
          python3 weave-language/scripts/check_algebra.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_functions.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_assertions.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_rules.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_contexts.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_typed_contexts.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_live_handles.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_schema_functions.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_modules.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_scalars.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          cargo build --manifest-path weave-engine/Cargo.toml --locked -p weave-engine --example source_view_fixture
          python3 weave-language/scripts/check_view_services.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --host "$GITHUB_WORKSPACE/weave-engine/target/debug/examples/source_view_fixture"
          cargo build --manifest-path weave-engine/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture
          python3 weave-language/scripts/check_handlers.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --host "$GITHUB_WORKSPACE/weave-engine/target/debug/examples/compiled_handler_fixture"
          python3 weave-language/scripts/check_intervals.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_vectors.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_bytes_references.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          cargo build --manifest-path weave-engine/Cargo.toml --locked -p weave-engine --features recovery-testing --example governed_effect_probe
          python3 weave-engine/scripts/check_governed_effects.py --compiler "$GITHUB_WORKSPACE/weave-language/target/debug/weave" --probe "$GITHUB_WORKSPACE/weave-engine/target/debug/examples/governed_effect_probe"
          python3 weave-engine/scripts/root_metadata_selectors.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine" --language "$GITHUB_WORKSPACE/weave-language"
          python3 weave-language/scripts/check_counterparts.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_quantities.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_geometry.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          cargo build --manifest-path weave-engine/Cargo.toml --locked -p weave-engine --example native_services_fixture
          python3 weave-language/scripts/check_services.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine" --fixture "$GITHUB_WORKSPACE/weave-engine/target/debug/examples/native_services_fixture"
          python3 weave-engine/scripts/root_geometry.py
          python3 weave-engine/scripts/root_contexts.py
          python3 weave-engine/scripts/root_assertions.py
          python3 weave-engine/scripts/root_dispatch.py
          python3 weave-engine/scripts/root_admission.py
          python3 weave-engine/scripts/root_migration.py
          python3 weave-engine/scripts/root_identity.py
          python3 weave-engine/scripts/check_integration_recovery.py
          python3 weave-engine/scripts/check_governance_recovery.py
          python3 weave-engine/scripts/check_governance_delivery_recovery.py
          cargo build --manifest-path weave-engine/Cargo.toml --locked -p weave-engine --features recovery-testing --example view_schedule_probe
          python3 weave-engine/scripts/check_view_schedule_recovery.py --probe "$GITHUB_WORKSPACE/weave-engine/target/debug/examples/view_schedule_probe"
  compiler-host:
    name: Compiler SDK and native host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: libweave_native.so
            compiler: libweave_compiler_sdk.so
          - os: macos-latest
            runtime: libweave_native.dylib
            compiler: libweave_compiler_sdk.dylib
          - os: windows-latest
            runtime: weave_native.dll
            compiler: weave_compiler_sdk.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: weave-engine
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: 82a45f6391696b77e25710bde7276b40faf68d6f
          path: weave-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual compiler SDK and native embedding library
        run: |
          cargo build --manifest-path weave-language/Cargo.toml --locked -p weave-compiler-sdk
          cargo build --manifest-path weave-engine/Cargo.toml --locked -p weave-native
      - name: Verify arbitrary source artifacts, installation, ownership and restart
        run: python3 weave-engine/scripts/check_host_facade.py --library weave-engine/target/debug/${{ matrix.runtime }} --compiler-sdk weave-language/target/debug/${{ matrix.compiler }}
