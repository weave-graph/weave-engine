name: Language integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: weave-engine
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: d18300a08079e6a8c3680f7c78e0b25f6398eb48
          path: weave-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify actual compiler and persistent runtime
        run: |
          python3 weave-engine/scripts/root_integration.py
          python3 weave-engine/scripts/root_join.py
          python3 weave-engine/scripts/root_values.py
          python3 weave-engine/scripts/root_metadata.py
          python3 weave-engine/scripts/root_paper_example.py
          python3 weave-language/scripts/check_algebra.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_functions.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_assertions.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_rules.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_contexts.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_counterparts.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-language/scripts/check_geometry.py --engine "$GITHUB_WORKSPACE/weave-engine/target/debug/weave-engine"
          python3 weave-engine/scripts/root_geometry.py
          python3 weave-engine/scripts/root_contexts.py
          python3 weave-engine/scripts/root_assertions.py
          python3 weave-engine/scripts/root_dispatch.py
          python3 weave-engine/scripts/root_admission.py
          python3 weave-engine/scripts/root_migration.py
          python3 weave-engine/scripts/root_identity.py
