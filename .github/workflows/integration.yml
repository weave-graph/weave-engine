name: Language integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: weave-engine
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: eacb326baa1aebbcaf741f078996a55e700c2741
          path: weave-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify actual compiler and persistent runtime
        run: |
          python3 weave-engine/scripts/root_integration.py
          python3 weave-engine/scripts/root_join.py
          python3 weave-engine/scripts/root_values.py
          python3 weave-engine/scripts/root_metadata.py
          python3 weave-engine/scripts/root_paper_example.py
