name: Rust
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - name: Build native three-peer recovery fixture
        run: cargo build --locked -p weave-engine --example three_peer_trace --features recovery-testing
      - name: Execute isolated three-peer offline and recovery trace
        run: python3 scripts/check_three_peer_trace.py
      - name: Execute paired signed export and recovery trace
        run: python3 scripts/check_three_peer_trace.py --signed-export
      - name: Build governed effect recovery fixture
        run: cargo build --locked -p weave-engine --features recovery-testing --example governed_effect_probe
      - name: Execute governed effect and independent sink recovery
        run: python3 scripts/check_governed_effects.py
      - name: Verify state, erasure and rebuild process-crash boundaries
        run: |
          cargo build --locked -p weave-engine --features recovery-testing --example retention_probe
          python3 scripts/check_retention_recovery.py --host target/debug/examples/retention_probe --report retention-recovery.json
      - run: cargo run --locked -p weave-cluster --example measure_quality
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p weave-contract --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-policy --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-spaces --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-cluster --target wasm32-unknown-unknown --locked
      - name: Execute portable native and WebAssembly semantic parity
        run: python3 scripts/root_portable.py
      - name: Swift native host restart acceptance
        if: runner.os == 'macOS'
        run: python3 scripts/root_native.py
  snapshot-migration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: c209d49d33a8b4369a853673958bd9cec2765a96
            protocol: 0.16.0
            marker: 14
          - ref: 5e4e20699550ecede86e88296c9147392386b436
            protocol: 0.17.0
            marker: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: ${{ matrix.ref }}
          path: previous
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact prior protocol ${{ matrix.protocol }} fixtures
        working-directory: previous
        run: cargo build --locked -p weave-engine --features recovery-testing --example source_view_fixture --example three_peer_trace
      - name: Build current migration and replay fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example source_view_fixture --example three_peer_trace --example storage_probe
      - name: Verify populated upgrade, both crash boundaries and exact old replay
        working-directory: current
        run: python3 scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol ${{ matrix.protocol }} --old-marker ${{ matrix.marker }} --new-marker 22
  compiled-handler-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: edd58fdb0cbdc5f9299c2e55ba2765c37a2bca90
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: e18608b842ad6efc14f977e30ed428513c5900a5
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact historical compiler and handler fixture
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example storage_probe
      - name: Preserve actual completed and pending historical handlers across store upgrade
        working-directory: current
        run: python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --new-marker 22
  store18-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: ec65c636ccc86f617afdf93301168c98c11e7744
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: f18d35cf93ce3f45ce4e7b4b3c6971110e9d0ad4
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact store18 and compiler baselines
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe --example storage_probe
      - name: Preserve populated store18 across atomic recorded-history upgrade
        working-directory: current
        run: |
          python3 scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol 0.19.0 --old-marker 18 --new-marker 22
          python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --old-protocol 0.19.0 --old-marker 18 --new-marker 22
          python3 scripts/check_effect_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-probe ../previous/target/debug/examples/governed_effect_probe --probe target/debug/examples/governed_effect_probe --storage target/debug/examples/storage_probe --old-protocol 0.19.0 --old-marker 18 --new-marker 22
  store19-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 708a7b08a3aa3c60ac61de518a6e3f2ee2191856
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: f18d35cf93ce3f45ce4e7b4b3c6971110e9d0ad4
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact store19 and compiler baselines
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked -p weave-language -p weave-compiler-sdk --lib --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe -p weave-native --example native_scenario
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe --example storage_probe -p weave-native --example native_scenario
      - name: Preserve populated store19 across atomic recorded-history upgrade
        working-directory: current
        run: |
          python3 scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol 0.19.0 --old-marker 19 --new-marker 22
          python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --old-protocol 0.19.0 --old-marker 19 --new-marker 22
          python3 scripts/check_effect_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-probe ../previous/target/debug/examples/governed_effect_probe --probe target/debug/examples/governed_effect_probe --storage target/debug/examples/storage_probe --old-protocol 0.19.0 --old-marker 19 --new-marker 22
      - name: Preserve real historical retained cluster journal across host upgrade
        working-directory: current
        run: python3 scripts/check_native_scenario.py --compiler-sdk ../previous-language/target/debug/libweave_compiler_sdk.so --host ../previous/target/debug/examples/native_scenario --upgrade-host target/debug/examples/native_scenario --fixtures ../previous-language/examples/native_scenario --report retained-journal-upgrade.json
  store20-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: e6ff50528dcd55f17abdc39313a29d6cbddc898b
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: 535a50aae16d00f630b8a61a3a9bbc43d714e9a5
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact store20 and compiler baselines
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked -p weave-language -p weave-compiler-sdk --lib --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe -p weave-native --example native_scenario
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe --example storage_probe -p weave-native --example native_scenario
      - name: Preserve populated store20 across atomic recorded-history upgrade
        working-directory: current
        run: |
          python3 scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol 0.20.0 --old-marker 20 --new-marker 22
          python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --old-protocol 0.20.0 --old-marker 20 --new-marker 22
          python3 scripts/check_effect_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-probe ../previous/target/debug/examples/governed_effect_probe --probe target/debug/examples/governed_effect_probe --storage target/debug/examples/storage_probe --old-protocol 0.20.0 --old-marker 20 --new-marker 22
      - name: Preserve real historical retained cluster journal across host upgrade
        working-directory: current
        run: python3 scripts/check_native_scenario.py --compiler-sdk ../previous-language/target/debug/libweave_compiler_sdk.so --host ../previous/target/debug/examples/native_scenario --upgrade-host target/debug/examples/native_scenario --fixtures ../previous-language/examples/native_scenario --report retained-journal-upgrade.json
  store17-migration:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 21c27286749dcfa8833f903b631ea74537692647
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: 82a45f6391696b77e25710bde7276b40faf68d6f
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact store17 and compiler baselines
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe --example storage_probe
      - name: Preserve store17 views and signed replies exactly
        working-directory: current
        run: python3 scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol 0.18.0 --old-marker 17 --new-marker 22
      - name: Preserve store17 pending and completed handlers exactly
        working-directory: current
        run: python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --old-marker 17 --new-marker 22
      - name: Preserve unknown governed effect and independent sink
        working-directory: current
        run: python3 scripts/check_effect_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-probe ../previous/target/debug/examples/governed_effect_probe --probe target/debug/examples/governed_effect_probe --storage target/debug/examples/storage_probe --new-marker 22
  store21-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 3e09f61ed110854348362efe5d90d317988bc15e
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: 15e8c8f8ec92939e3422b33553b393bda469c61f
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact store21 and compiler baselines
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked -p weave-language -p weave-compiler-sdk --lib --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe -p weave-native --example native_scenario
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example source_view_fixture --example three_peer_trace --example governed_effect_probe --example storage_probe --example retention_probe -p weave-native --example native_scenario
      - name: Preserve populated store21 across atomic retention upgrade
        working-directory: current
        run: |
          python3 scripts/check_retention_inventory.py --host target/debug/examples/retention_probe --evidence-dir retention-snapshot-inventory scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol 0.21.0 --old-marker 21 --new-marker 22
          python3 scripts/check_retention_inventory.py --host target/debug/examples/retention_probe --evidence-dir retention-handler-inventory scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --old-protocol 0.21.0 --old-marker 21 --new-marker 22
          python3 scripts/check_retention_inventory.py --host target/debug/examples/retention_probe --evidence-dir retention-effect-inventory scripts/check_effect_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-probe ../previous/target/debug/examples/governed_effect_probe --probe target/debug/examples/governed_effect_probe --storage target/debug/examples/storage_probe --old-protocol 0.21.0 --old-marker 21 --new-marker 22
      - name: Preserve real historical retained cluster journal across host upgrade
        working-directory: current
        run: python3 scripts/check_native_scenario.py --compiler-sdk ../previous-language/target/debug/libweave_compiler_sdk.so --host ../previous/target/debug/examples/native_scenario --upgrade-host target/debug/examples/native_scenario --fixtures ../previous-language/examples/native_scenario --report retained-journal-upgrade.json
      - name: Preserve genuine accepted-time history through the retention upgrade
        working-directory: current
        run: python3 scripts/check_retention_inventory.py --host target/debug/examples/retention_probe --evidence-dir retention-accepted-inventory scripts/check_accepted_history_compat.py --old-host ../previous/target/debug/examples/source_view_fixture --host target/debug/examples/source_view_fixture --storage target/debug/examples/storage_probe --old-marker 21 --new-marker 22 --report accepted-history-retention.json
