          python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --old-protocol 0.19.0 --old-marker 19 --new-marker 27
          python3 scripts/check_effect_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-probe ../previous/target/debug/examples/governed_effect_probe --probe target/debug/examples/governed_effect_probe --storage target/debug/examples/storage_probe --old-protocol 0.19.0 --old-marker 19 --new-marker 27
      - name: Preserve real historical retained cluster journal across host upgrade
        working-directory: current
        run: python3 scripts/check_native_scenario.py --compiler-sdk ../previous-language/target/debug/libweave_compiler_sdk.so --host ../previous/target/debug/examples/native_scenario --upgrade-host target/debug/examples/native_scenario --fixtures ../previous-language/examples/native_scenario --report retained-journal-upgrade.json
