name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p weave-cluster --example measure_quality
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p weave-contract --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-policy --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-spaces --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-cluster --target wasm32-unknown-unknown --locked
      - name: Swift native host restart acceptance
        if: runner.os == 'macOS'
        run: python3 scripts/root_native.py
