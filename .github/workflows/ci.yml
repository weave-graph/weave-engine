name: Native science
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-science-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-science
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Fact-store SQL boundary (ADR-0004)
        run: python scripts/check_fact_store_boundary.py
      - name: Build native experiment engine
        run: cargo build --locked -p weave-science
      - name: README quickstart, hardware model and hybrid retrieval
        shell: bash
        run: |
          cargo build --locked -p weave-hardware -p weave-science
          dir=target/quickstart && rm -rf "$dir" && mkdir -p "$dir"
          target/debug/weave-hardware generate --out "$dir/fleet" --units 60 --updates 40
          target/debug/weave-hardware import --db "$dir/fleet.db" --actor etl-importer --graph fleet --csv "$dir/fleet/base"
          target/debug/weave-hardware apply-updates --db "$dir/fleet.db" --actor etl-importer --graph fleet --updates "$dir/fleet/updates.jsonl"
          python examples/hardware/hybrid_quickstart.py --science target/debug/weave-science --db "$dir/fleet.db" --fleet "$dir/fleet"
          python examples/hardware/hybrid_quickstart.py --science target/debug/weave-science --db "$dir/fleet.db" --fleet "$dir/fleet" --reader fleet-admin
      - name: Install Python experiment client
        run: python -m pip install ./python
      - name: Python client checks
        env:
          WEAVE_SCIENCE_BINARY: ${{ runner.os == 'Windows' && 'target/debug/weave-science.exe' || 'target/debug/weave-science' }}
        run: python -m unittest discover -s python/tests -v
      - name: Independent scientific acceptance
        run: python scripts/check_science.py --engine "${{ runner.os == 'Windows' && 'target/debug/weave-science.exe' || 'target/debug/weave-science' }}" --report science-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-acceptance-${{ matrix.os }}
          path: science-acceptance.json
          if-no-files-found: ignore
  fact-scale-1m:
    # Separate job, so a slow runner here cannot hide failures elsewhere.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fact-scale
      - name: 1M-fact graph, O(change) writes and 120k single-fact revisions (release)
        env:
          WEAVE_SCALE_FACTS: '1000000'
          WEAVE_SCALE_WRITES: '120000'
        run: cargo test --release --locked -p weave-engine --test fact_scale -- --nocapture
      - name: k-hop expand on a 100k-fact graph against a BFS oracle (release)
        env:
          WEAVE_A3_FACTS: '100000'
        run: cargo test --release --locked -p weave-engine --test traversal_scale -- --nocapture
      - name: Whole-space exact nearest over 20k vectors of 1,536 dimensions, past the read budget (release)
        env:
          WEAVE_A4_VECTORS: '20000'
        run: cargo test --release --locked -p weave-engine --test embedding_scale -- --nocapture
  noninterference:
    # B2 (#5, ADR-0008 section 7): the property-based noninterference harness
    # at 500 generated cases per operator and per science analysis (the PR
    # tier). The scheduled job in noninterference-full.yml runs 10,000.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: noninterference
      - name: Every GraphExpression operator, 500 cases each (release)
        env:
          WEAVE_NI_CASES: '500'
        run: cargo test --release --locked -p weave-engine --test noninterference -- --nocapture
      - name: Every science analysis, 500 cases each (release)
        env:
          WEAVE_NI_CASES: '500'
        run: cargo test --release --locked -p weave-science --test noninterference -- --nocapture
  phase-a-exit:
    # The whole Phase A exit scenario (docs/ROADMAP.md) at its exit size, 5,000
    # units and 1,000 updates, on every supported OS, in its own job so a slow
    # runner here cannot hide failures elsewhere. One script runs the three
    # scenario tests optimized and gives one pass/fail with a JSON report.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: phase-a-exit
      - name: Phase A exit scenario, 5,000 units and 1,000 updates (release)
        run: python scripts/check_phase_a_exit.py --units 5000 --updates 1000 --report phase-a-exit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-a-exit-${{ matrix.os }}
          path: phase-a-exit.json
          if-no-files-found: ignore
