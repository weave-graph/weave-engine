name: Rust
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - name: Build native three-peer recovery fixture
        run: cargo build --locked -p weave-engine --example three_peer_trace --features recovery-testing
      - name: Execute isolated three-peer offline and recovery trace
        run: python3 scripts/check_three_peer_trace.py
      - name: Execute paired signed export and recovery trace
        run: python3 scripts/check_three_peer_trace.py --signed-export
      - name: Build governed effect recovery fixture
        run: cargo build --locked -p weave-engine --features recovery-testing --example governed_effect_probe
      - name: Execute governed effect and independent sink recovery
        run: python3 scripts/check_governed_effects.py
      - name: Verify state, erasure and rebuild process-crash boundaries
        run: |
          cargo build --locked -p weave-engine --features recovery-testing --example retention_probe
          python3 scripts/check_retention_recovery.py --host target/debug/examples/retention_probe --report retention-recovery.json
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 67ecc70708e15962c9f850ce826c90fb9c145ca0
          path: previous-store22
      - name: Build exact previous store22 retention host
        working-directory: previous-store22
        run: cargo build --locked -p weave-engine --features recovery-testing --example retention_probe
      - name: Verify genuine store22 lifecycle upgrade and four process-death pairs
        run: |
          cargo build --locked -p weave-engine --features recovery-testing --example lifecycle_probe
          python3 scripts/check_lifecycle_recovery.py --old-host previous-store22/target/debug/examples/retention_probe --host target/debug/examples/lifecycle_probe --report lifecycle-recovery.json
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 6cff9b389451c93664f639eeb4c7555fa0f046f9
          path: previous-store23
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: 15e8c8f8ec92939e3422b33553b393bda469c61f
          path: lifecycle-compiler
      - name: Build exact store23 lifecycle and source compiler baselines
        run: |
          cargo build --manifest-path previous-store23/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example lifecycle_probe
          cargo build --manifest-path lifecycle-compiler/Cargo.toml --locked -p weave-language --bin weave
      - name: Verify source compiled upgrade, rollback and populated store23 process recovery
        run: |
          cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example lifecycle_probe --example storage_probe
          python3 scripts/check_compiled_lifecycle.py --compiler lifecycle-compiler/target/debug/weave --old-handler previous-store23/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --old-retention previous-store22/target/debug/examples/retention_probe --old-lifecycle previous-store23/target/debug/examples/lifecycle_probe --lifecycle target/debug/examples/lifecycle_probe --storage target/debug/examples/storage_probe --report compiled-lifecycle-recovery.json
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 4d57dfabe6345b0c4a9de1155aff617a739970da
          path: previous-store24
      - name: Build exact store24 source lifecycle baseline
        working-directory: previous-store24
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture
      - name: Verify actual source snapshot reconstruction and four process-death pairs
        run: python3 scripts/check_compiled_rebuild.py --compiler lifecycle-compiler/target/debug/weave --old-handler previous-store24/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --report compiled-rebuild-recovery.json
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 6f98d559bfa7964c2e11ea604b3cd537bbd1e42d
          path: previous-store25
      - name: Build exact store25 reconstruction baseline
        working-directory: previous-store25
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture
      - name: Verify actual recorded actor, independent tool/sink journals and nine process deaths
        run: |
          cargo build --locked -p weave-engine --features recovery-testing --example recorded_actor_fixture
          python3 scripts/check_recorded_actor.py --compiler lifecycle-compiler/target/debug/weave --old-handler previous-store25/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --actor target/debug/examples/recorded_actor_fixture --report recorded-actor-recovery.json
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: 70f5871d9b32b8618800bc47a471d3e4e2f7aba6
          path: previous-store26
      - name: Build exact store26 actor journal baseline
        working-directory: previous-store26
        run: cargo build --locked -p weave-engine --features recovery-testing --example recorded_actor_fixture
      - name: Verify versioned native actor transfer and default historical observation
        run: |
          cargo build --locked -p weave-engine --features recovery-testing --example actor_lifecycle_fixture
          python3 scripts/check_actor_lifecycle.py --old-actor previous-store26/target/debug/examples/recorded_actor_fixture --actor target/debug/examples/actor_lifecycle_fixture --report actor-lifecycle-recovery.json
      - run: cargo run --locked -p weave-cluster --example measure_quality
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p weave-contract --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-policy --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-spaces --target wasm32-unknown-unknown --locked
      - run: cargo check -p weave-cluster --target wasm32-unknown-unknown --locked
      - name: Execute portable native and WebAssembly semantic parity
        run: python3 scripts/root_portable.py
      - name: Swift native host restart acceptance
        if: runner.os == 'macOS'
        run: python3 scripts/root_native.py
  snapshot-migration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: c209d49d33a8b4369a853673958bd9cec2765a96
            protocol: 0.16.0
            marker: 14
          - ref: 5e4e20699550ecede86e88296c9147392386b436
            protocol: 0.17.0
            marker: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: ${{ matrix.ref }}
          path: previous
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact prior protocol ${{ matrix.protocol }} fixtures
        working-directory: previous
        run: cargo build --locked -p weave-engine --features recovery-testing --example source_view_fixture --example three_peer_trace
      - name: Build current migration and replay fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example source_view_fixture --example three_peer_trace --example storage_probe
      - name: Verify populated upgrade, both crash boundaries and exact old replay
        working-directory: current
        run: python3 scripts/check_snapshot_migration.py --old-view ../previous/target/debug/examples/source_view_fixture --old-trace ../previous/target/debug/examples/three_peer_trace --old-protocol ${{ matrix.protocol }} --old-marker ${{ matrix.marker }} --new-marker 27
  compiled-handler-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-engine
          ref: edd58fdb0cbdc5f9299c2e55ba2765c37a2bca90
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: weave-graph/weave-language
          ref: e18608b842ad6efc14f977e30ed428513c5900a5
          path: previous-language
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact historical compiler and handler fixture
        run: |
          cargo build --manifest-path previous-language/Cargo.toml --locked --bin weave
          cargo build --manifest-path previous/Cargo.toml --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture
      - name: Build current migration fixtures
        working-directory: current
        run: cargo build --locked -p weave-engine --features recovery-testing --example compiled_handler_fixture --example storage_probe
      - name: Preserve actual completed and pending historical handlers across store upgrade
        working-directory: current
        run: python3 scripts/check_handler_store_migration.py --old-compiler ../previous-language/target/debug/weave --old-handler ../previous/target/debug/examples/compiled_handler_fixture --handler target/debug/examples/compiled_handler_fixture --storage target/debug/examples/storage_probe --new-marker 27
