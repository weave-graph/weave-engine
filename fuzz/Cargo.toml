[package]
name = "weave-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
weave-engine = { path = "../crates/weave-engine" }
weave-policy = { path = "../crates/weave-policy" }
weave-science = { path = "../crates/weave-science" }
weave-mcp = { path = "../crates/weave-mcp" }
serde = "1"
tempfile = "3"

[dependencies.weave-contract]
path = "../crates/weave-contract"

[[bin]]
name = "program_atomic"
path = "fuzz_targets/program_atomic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capsule_receive"
path = "fuzz_targets/capsule_receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_wire"
path = "fuzz_targets/policy_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fact_write"
path = "fuzz_targets/fact_write.rs"
test = false
doc = false
bench = false

[[bin]]
name = "traversal_plans"
path = "fuzz_targets/traversal_plans.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vector_plans"
path = "fuzz_targets/vector_plans.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_jsonrpc"
path = "fuzz_targets/mcp_jsonrpc.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
